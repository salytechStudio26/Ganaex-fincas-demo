<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado crias</title>

    <link rel="stylesheet" href="../../../estilosUniversales/estiloTablas.css">
</head>

<body>

    <header class="cabecera">
        <img src="../../../imagenes/logo.png" alt="Logo de la aplicación">
        <h1>LISTADO COMPLETO DE CRIAS EN LA FINCA</h1>
    </header>

    <main class="contenidoPrincipal">

        <aside class="zonaBotones">
            <button id="btnNuevoAnimal" class="btnAccion">Nuevo registro</button>
            <button id="btnGuardarAnimales" class="btnAccion">Guardar</button>
            <button id="btnModificarAnimal" class="btnAccion">Modificar</button>
            <button id="btnBuscarAnimales" class="btnAccion">Buscar</button>
            <button id="btnRestablecerAnimales" class="btnAccion">Restablecer</button>
            <button id="btnSeleccionarAnimales" class="btnAccion">Seleccionar</button>
            <button id="btnEliminarAnimales" class="btnAccion">Eliminar</button>
            <button id="btnPDFAnimales" class="btnAccion">PDF</button>
        </aside>

        <section class="zonaTabla">
            <div class="table-container">
                <table id="tablaCriasIndividuales" class="tablaContenido">
                   <thead>
    <tr>
        <th data-columna="id">ID*</th> <!--Autoincrmental seguido de la tabla animales.-->
        <th data-columna="identificacion">Nº Identificación cria*</th> <!-- Este es el crotal de la cria-->
        <th data-columna="fechaNacimiento">Fecha nacimiento</th>
        <th data-columna="tipoEntrada">Tipo entrada</th>  
        <th data-columna="crotalMadre">Crotal Madre</th> 
        <th data-columna="raza">Raza*</th>
        <th data-columna="sexo">Sexo*</th>
        <th data-columna="zona">Zona</th>
        <th data-columna="observaciones">Observaciones</th>
    </tr>
</thead>

                    <tbody class="listadoRegistrosTabla"></tbody>
                </table>
            </div>
        </section>

        <p class="notaCampos">Las columnas con * son obligatorias</p>
    </main>

    <footer class="piePagina">
        <div class="fechaYhora"></div>

        <a href="../MenúPrincipal/menuPrincipalIndividual.html">Menú Principal</a>
        <a href="../../../misFincas/misFincas.html">Mis Fincas</a>
        <a href="../../../inicio/index.html">Inicio</a>
    </footer>

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- SCRIPTS UNIVERSALES -->
    <script type="module" src="../../../archivosUniversales/controladorEventos.js"></script>
    <script src="../../../archivosUniversales/fechaYhora.js"></script>

    <!-- script de la base de datos y el controlador -->
    <script type="module" src="criasIndividualesDemoBD.js"></script>
    <script type="module" src="controladorCriasIndividualesDemo.js"></script>

</body>
</html>
