<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte</title>

    <link rel="stylesheet" href="../../../estilosUniversales/estiloTablas.css">
</head>

<body>

    <header class="cabecera">
        <img src="../../../imagenes/logo.png" alt="Logo de la aplicación">
        <h1>REGISTRO DE ENTRADAS Y SALIDAS POR TRANSPORTE</h1>
    </header>

    <main class="contenidoPrincipal">

        <aside class="zonaBotones">
            <button id="btnNuevoTransporte" class="btnAccion">Nuevo registro</button>
            <button id="btnGuardarTransporte" class="btnAccion">Guardar</button>
            <button id="btnModificarTransporte" class="btnAccion">Modificar</button>
            <button id="btnSeleccionarTransporte" class="btnAccion">Seleccionar</button>
            <button id="btnEliminarTransporte" class="btnAccion">Eliminar</button>
        </aside>

        <section class="zonaTabla">
            <div class="table-container">
                <table id="tablaTransporte" class="tablaContenido">
                    <thead>
                        <tr>
                            <th data-columna="tipoTransporte">Tipo transporte*</th>
                            <th data-columna="id">ID*</th>
                            <th data-columna="idHeredado">ID Heredado*</th>
                            <th data-columna="fechaTransporte">Fecha transporte*</th>
                            <th data-columna="identificacion">Nº Identificación*</th>
                            <th data-columna="lote">Nº Lote*</th>
                            <th data-columna="cantidad">Cantidad*</th>
                            <th data-columna="descripcion">Descripción</th>
                            <th data-columna="observaciones">Observaciones</th>
                        </tr>
                    </thead>

                    <tbody class="listadoRegistrosTabla"></tbody>
                </table>
            </div>
        </section>

        <p class="notaCampos">Las columnas con * son obligatorias</p>
    </main>

    <footer class="piePagina">
        <div class="fechaYhora"></div>

        <a href="../MenúPrincipal/menuPrincipalIndividual.html">Menú Principal</a>
        <a href="../../../misFincas/misFincas.html">Mis Fincas</a>
        <a href="../../../inicio/index.html">Inicio</a>
    </footer>

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- SCRIPTS UNIVERSALES -->
    <script type="module" src="../../../archivosUniversales/controladorEventos.js"></script>
    <script src="../../../archivosUniversales/fechaYhora.js"></script>

    <!-- script de la base de datos y el controlador -->
    <script type="module" src="transporteDemoBD.js"></script>
    <script type="module" src="transporteDemo.js"></script>

</body>
</html>
